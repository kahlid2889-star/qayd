# قيد — اللعبة + Postgres + Caddy (HTTPS تلقائي).
# من جذر المشروع:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: qayd

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qayd
      POSTGRES_DB: qayd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}
    volumes:
      - qayd-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qayd -d qayd"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qayd:${POSTGRES_PASSWORD}@db:5432/qayd
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?ضع BETTER_AUTH_SECRET في .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?ضع BETTER_AUTH_URL في .env}
      VITE_AUTH_ENABLED: "true"
      QAYD_MODE: ${QAYD_MODE:-prod}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      QAYD_DOMAIN: ${QAYD_DOMAIN:?ضع QAYD_DOMAIN في .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  qayd-pg:
  caddy-data:
  caddy-config:
